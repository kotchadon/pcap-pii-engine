name: tests
on: [push, pull_request]
concurrency:
  group: trace-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  pytest:
    name: ${{ matrix.dependencies }} tests
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        dependencies: [core, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - if: matrix.dependencies == 'ml'
        name: Install CPU-only ML test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml,http2]' psutil jsonschema dpkt
      - if: matrix.dependencies == 'ml'
        name: Require frozen V2 weights before ML tests
        run: python -c "from packet_pii.ml.bilstm import load_predictor; load_predictor('src/packet_pii/ml/artifacts/bilstm_v2')"
      # This generated capture is intentionally gitignored. Regenerate from
      # independent, frozen scenario definitions and verify its committed
      # manifest hash before tests; never weaken or bypass SHA-256 binding.
      - name: Materialize verified fictional PCAP fixture
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          import tempfile
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "examples"))
          import generate_groundtruth_fixture as generator
          destination = root / "examples" / "groundtruth"
          expected_path = destination / "controlled_fixture_v1.manifest.json"
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as tmp:
              capture, manifest = generator.generate(tmp)
              digest = hashlib.sha256(capture.read_bytes()).hexdigest()
              frozen = expected["capture"]["sha256"]
              if digest != frozen:
                  raise SystemExit(
                      "Generated ground-truth PCAP changed across Python versions "
                      f"({digest} != frozen {frozen}); refusing unverified fixture"
                  )
              if manifest.read_bytes() != expected_path.read_bytes():
                  raise SystemExit(
                      "Generated manifest differs from frozen committed annotations; "
                      "refusing to silently modify ground truth"
                  )
              shutil.copyfile(capture, destination / capture.name)
              print(f"Verified and generated {capture.name}: SHA-256 {digest}")
          PY
      - run: python -m pytest -q -ra

  browser:
    name: real Chromium UI journeys
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TRACE and browser test dependencies
        run: python -m pip install -e . pytest playwright dpkt h11
      - name: Install matching Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser regression and evidence checks (never silently skip Chromium)
        env:
          TRACE_REQUIRE_BROWSER: '1'
          TRACE_UI_ARTIFACT_DIR: artifacts/trace-ui
        run: python -m pytest -q tests/test_experience_journeys.py tests/test_http_investigation_ui.py
      - name: Attach synthetic-capture UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-real-browser-screenshots
          path: artifacts/trace-ui/
          if-no-files-found: ignore
          retention-days: 7

  mentor-demo:
    name: Nishant packet-to-HTTP demo through real APIs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narrow fixture verifier dependencies
        run: python -m pip install -e . dpkt==1.9.8 h11==0.16.0
      - name: Execute authenticated capture / HTTP / source-evidence demonstration
        run: python scripts/validation/run_mentor_demo.py --output /tmp/trace-mentor-ci
      - name: Require complete original-byte and HTML verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/trace-mentor-ci')
          v=json.loads((root/'verification.json').read_text())
          assert (root/'mentor-demo.pcap').is_file()
          assert (root/'captured-response.html.txt').is_file()
          assert (root/'captured-page.static.html').is_file()
          assert (root/'EVIDENCE.md').is_file()
          assert v['exact_email_source_intervals'], 'no original packet ranges'
          print('Mentor demo artifacts and captured evidence verified; TShark:',
                v.get('tshark',{}).get('status','unavailable'))
          PY

  hybrid-smoke:
    name: Actual V2 Hybrid 2MiB smoke (not M3 benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and TRACE ML dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml,http2]' psutil dpkt jsonschema
      - name: Run bounded real-checkpoint end-to-end indexed scan
        run: |
          python scripts/validation/bench_performance_memory.py --source-root . --capture /tmp/trace-hybrid-2mib.pcap --output /tmp/trace-hybrid-smoke.json --mib 2 --profile standard --indexed --checkpoint src/packet_pii/ml/artifacts/bilstm_v2 --repeat 1
      - name: Validate result status and report resource observations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/trace-hybrid-smoke.json').read_text())
          assert report['mode']=='hybrid' and report['scope']=='JobManager + SQLite index + atomic report'
          assert len(report['runs'])==1
          result=report['runs'][0]
          assert result['status']=='completed',result
          summary=result['summary']
          assert summary.get('ml_fields_evaluated',0)>0, 'real model evaluated no fields'
          assert result['current_rss_after_analysis']<=report['memory_budget_bytes'], 'scan over RSS budget'
          print(json.dumps({'status':result['status'],'seconds':result['seconds'],
                'model_seconds':result.get('model_seconds'),'peak_rss':result['lifetime_peak_rss'],
                'evaluated':summary.get('ml_fields_evaluated'),
                'ml_coverage':summary.get('ml_coverage_status'),
                'analysis_incomplete':summary.get('analysis_incomplete')},sort_keys=True))
          PY
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-hybrid-2mib-smoke
          path: /tmp/trace-hybrid-smoke.json
          if-no-files-found: ignore
          retention-days: 7
