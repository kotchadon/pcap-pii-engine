[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-pii-engine"
version = "0.1.0"
description = "Local-first PCAP/PCAPNG PII audit prototype"
requires-python = ">=3.10"
license = {text = "Proprietary - all rights reserved"}

[project.optional-dependencies]
http2 = ["hpack>=4.1,<5"]  # maintained HPACK decoder; optional bounded plaintext HTTP/2
ml = ["torch>=2.2"]  # optional: BiLSTM contextual detector (packet_pii.ml.bilstm)

[project.scripts]
pcap-pii = "packet_pii.cli:main"
pcap-pii-evaluate = "packet_pii.evaluate_cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
