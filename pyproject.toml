[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-pii-engine"
version = "0.1.0"
description = "Local-first PCAP/PCAPNG PII audit prototype"
requires-python = ">=3.10"
license = {text = "Proprietary - all rights reserved"}

[project.scripts]
pcap-pii = "packet_pii.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
